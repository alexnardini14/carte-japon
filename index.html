<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carte PVT Japon</title>
<meta name="theme-color" content="#c8402a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Japon">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.34.4/mapbox-gl.css">
<style>
html,body{margin:0;height:100%}
[hidden]{display:none!important}
/* Layout: plein écran carte, barre flottante en haut (recherche + filtres), panneau glissant en bas (itinéraire / liste / admin). */
:root{
  --sea:#d9e3e8; --land:#fbfcfa; --border:#cfd8d4; --ink:#16232b; --muted:#5c6b73;
  --panel:#ffffff; --line:#e3e8e6; --chip:#eef2f1; --accent:#c8402a; --shadow:0 6px 24px rgba(20,40,50,.14);
  --c-manger:#e0673a; --c-activite:#3a6fd8; --c-rando:#2f8f5b; --c-hotel:#7a4fc9; --c-voiture:#4a5560;
  --c-reco:#c99a12; --c-shopping:#a35d8f; --c-trier:#8a949a; --c-reel:#d6336c; --c-admin:#0f8a8a; --c-route:#c8402a;
  --f-display:"Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sea:#0e1a21; --land:#1d2b33; --border:#2c3d47; --ink:#e8eef0; --muted:#95a6ae;
  --panel:#16232b; --line:#263741; --chip:#22323b; --accent:#ef6a52; --shadow:0 6px 24px rgba(0,0,0,.45);
  --c-voiture:#9aa7b0; --c-route:#ef6a52; color-scheme:dark}}
:root[data-theme="dark"]{
  --sea:#0e1a21; --land:#1d2b33; --border:#2c3d47; --ink:#e8eef0; --muted:#95a6ae;
  --panel:#16232b; --line:#263741; --chip:#22323b; --accent:#ef6a52; --shadow:0 6px 24px rgba(0,0,0,.45);
  --c-voiture:#9aa7b0; --c-route:#ef6a52; color-scheme:dark}
html,body{height:100%}
body{background:var(--sea);color:var(--ink);font-family:var(--f-body);overflow:hidden}
#map{position:fixed;inset:0;background:var(--sea)}

/* Barre du haut */
.top{position:fixed;top:0;left:0;right:0;z-index:1000;pointer-events:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:8px}
.bar{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:8px 10px 8px 14px}
.brand{font-family:var(--f-display);font-weight:700;font-size:15px;white-space:nowrap;letter-spacing:.01em}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.02em}
.search{flex:1;min-width:0;border:0;background:var(--chip);color:var(--ink);border-radius:10px;padding:9px 12px;font:inherit;font-size:16px}
.search:focus{outline:2px solid var(--accent);outline-offset:0}
.chips{pointer-events:auto;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px;margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:7px 12px 7px 8px;
  background:var(--panel);color:var(--ink);font:500 13px var(--f-body);box-shadow:0 2px 8px rgba(20,40,50,.12);cursor:pointer;transition:opacity .15s,transform .1s}
.chip:active{transform:scale(.96)}
.chip .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff}
.chip .ic svg{width:12px;height:12px}
.chip .n{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.chip[aria-pressed="false"]{opacity:.45;box-shadow:none;background:var(--chip)}
.chip[aria-pressed="false"] .ic{background:var(--muted)!important}
.subs .chip{padding:5px 11px;font-size:12px}
.subs .chip[aria-pressed="true"]{background:var(--c-manger);color:#fff}
.subs .chip[aria-pressed="true"] .n{color:rgba(255,255,255,.8)}
.subs .chip[aria-pressed="false"]{opacity:1;background:var(--panel);box-shadow:0 2px 8px rgba(20,40,50,.12)}
.chip:focus-visible{outline:2px solid var(--accent)}


/* Bouton localiser / zoom */
.fabs{position:fixed;right:max(12px,env(safe-area-inset-right,0px));z-index:1000;display:flex;flex-direction:column;gap:8px;transition:bottom .25s}
.fab{width:44px;height:44px;border-radius:12px;border:0;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;font-size:20px}
.fab svg{width:20px;height:20px}
.fab.add{background:var(--accent);color:#fff;border-radius:50%;width:52px;height:52px}

/* Panneau du bas */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:1001;background:var(--panel);border-radius:18px 18px 0 0;box-shadow:0 -6px 28px rgba(20,40,50,.18);
  display:flex;flex-direction:column;height:38vh;max-height:calc(100% - 140px);transition:height .25s ease;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.min{height:118px}
.sheet.max{height:calc(100% - 140px)}
.grab{border:0;background:none;padding:8px 0 4px;cursor:grab;display:flex;justify-content:center;width:100%}
.grab i{width:40px;height:5px;border-radius:3px;background:var(--line)}
.tabs{display:flex;gap:4px;padding:0 max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.tab{border:0;background:none;color:var(--muted);font:600 14px var(--f-body);padding:8px 10px;border-radius:8px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);background:var(--chip)}
.body{flex:1;overflow-y:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));-webkit-overflow-scrolling:touch}
.note{font-size:12px;color:var(--muted);margin:0 0 10px}
.tag-ex{display:inline-block;font:600 10px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border:1px solid currentColor;border-radius:4px;padding:1px 5px;vertical-align:middle}


/* Liste */
.row{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff}
.row .ic svg{width:16px;height:16px}
.row b{display:block;font-weight:600;font-size:14px}
.row .txt{display:block;color:var(--ink)}
.row .txt>span{display:block;font-size:12px;color:var(--muted)}
.row em{font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap}
.empty{color:var(--muted);font-size:14px;padding:20px 0;text-align:center}


/* Fiche lieu */
.detail .hd{display:flex;gap:12px;align-items:flex-start}
.detail .hd .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:#fff;flex:none}
.detail .hd .ic svg{width:20px;height:20px}
.detail h3{margin:0;font:700 18px var(--f-display);text-wrap:balance}
.detail .meta{font-size:13px;color:var(--muted);margin-top:2px}
.detail p{font-size:14px;line-height:1.5;margin:12px 0}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.pill{font-size:12px;background:var(--chip);border-radius:999px;padding:4px 10px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:10px;padding:10px 14px;font:600 14px var(--f-body);text-decoration:none;cursor:pointer;background:var(--chip);color:var(--ink)}
.btn.primary{background:var(--accent);color:#fff}
.back{border:0;background:none;color:var(--muted);font:500 13px var(--f-body);padding:0 0 10px;cursor:pointer}

/* Formulaire ajout */
.form{display:flex;flex-direction:column;gap:10px}
.form label{font:600 12px var(--f-body);color:var(--muted);display:flex;flex-direction:column;gap:5px}
.form input,.form select,.form textarea{font:400 16px var(--f-body);color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.form textarea{min-height:60px;resize:vertical}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 11px;font:500 13px var(--f-body);cursor:pointer}
.cats button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.hint{font-size:12px;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 150px);max-width:calc(100% - 32px);text-align:center;transform:translateX(-50%);z-index:1200;background:var(--ink);color:var(--panel);padding:9px 14px;border-radius:10px;font-size:13px;box-shadow:var(--shadow)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (min-width:760px){
  .sheet{left:auto;right:16px;bottom:16px;width:400px;border-radius:18px;height:calc(100% - 150px)}
  .sheet.min{height:118px}
  .fabs{right:432px;bottom:24px!important}
  .top{right:auto;width:min(720px,calc(100% - 440px))}
}

.mapboxgl-ctrl-bottom-left,.mapboxgl-ctrl-bottom-right{bottom:var(--sheet-h,0px);transition:bottom .25s}
.mapboxgl-ctrl-bottom-right{right:max(64px,env(safe-area-inset-right,0px))}
#map{position:fixed;inset:0}

.row{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:inherit;font:inherit;padding:9px 0}
.row .txt{min-width:0;overflow:hidden}
.row .txt b,.row .txt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row:focus-visible,.btn:focus-visible,.back:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.form-title{margin:0;font:700 18px var(--f-display)}
.hint.label{margin-bottom:6px;font-weight:600}
.form .actions{margin-top:0}
h2.tab{margin:0;cursor:default}
</style>
</head>
<body>
<div id="map" aria-label="Carte du Japon"></div>

<div class="top">
  <div class="bar">
    <div class="brand">PVT Japon<small>sept. 2027 → mai 2028</small></div>
    <input id="q" class="search" type="search" placeholder="Chercher un lieu, une ville…" autocomplete="off">
  </div>
  <div class="chips" id="chips" role="toolbar" aria-label="Filtres"></div>
  <div class="chips subs" id="subchips" role="toolbar" aria-label="Type de cuisine"></div>
</div>

<div class="fabs" id="fabs">
  <button class="fab" id="fitAll" title="Voir tout le Japon" aria-label="Voir tout le Japon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button class="fab add" id="addBtn" title="Ajouter" aria-label="Ajouter un lieu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
</div>

<section class="sheet" id="sheet">
  <button class="grab" id="grab" aria-label="Agrandir ou réduire le panneau"><i></i></button>
  <div class="tabs">
    <h2 class="tab" aria-selected="true">Mes lieux</h2>
  </div>
  <div class="body" id="body"></div>
</section>
<script src="https://api.mapbox.com/mapbox-gl-js/v3.34.4/mapbox-gl.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
